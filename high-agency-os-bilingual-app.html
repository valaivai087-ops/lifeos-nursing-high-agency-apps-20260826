// Add items 201-300 with same pattern
for (let i = 201; i <= 300; i++) {
    CONTRASTS[i] = [`舊_${i}`, `新_${i}`, `Old_${i}`, `New_${i}`];
}

let currentFilter = 'all';
let expandedItems = new Set();

function getGroup(num) {
    if (num <= 100) return 'group1';
    if (num <= 200) return 'group2';
    return 'group3';
}

function renderNav() {
    const nav = document.getElementById('navContainer');
    nav.innerHTML = '';
    
    const groups = [
        {title: '第一組 Group 1', range: [1, 100], filter: 'group1'},
        {title: '第二組 Group 2', range: [101, 200], filter: 'group2'},
        {title: '第三組 Group 3', range: [201, 300], filter: 'group3'}
    ];
    
    groups.forEach(group => {
        const section = document.createElement('div');
        section.className = 'nav-section';
        
        const title = document.createElement('div');
        title.className = 'nav-section-title';
        title.textContent = group.title;
        section.appendChild(title);
        
        for (let i = group.range[0]; i <= group.range[1]; i += 10) {
            const item = document.createElement('div');
            item.className = 'nav-item';
            item.textContent = `#${i}-${Math.min(i+9, group.range[1])}`;
            item.onclick = () => {
                filterGroup(group.filter);
                const elem = document.querySelector(`[data-item="${i}"]`);
                if (elem) elem.scrollIntoView({behavior: 'smooth'});
            };
            section.appendChild(item);
        }
        
        nav.appendChild(section);
    });
}

function toggleItem(num) {
    const item = document.querySelector(`[data-item="${num}"]`);
    if (expandedItems.has(num)) {
        expandedItems.delete(num);
        item.classList.remove('expanded');
    } else {
        expandedItems.add(num);
        item.classList.add('expanded');
    }
}

function renderItems() {
    const container = document.getElementById('contentArea');
    container.innerHTML = '';
    
    for (let i = 1; i <= 300; i++) {
        const groupKey = getGroup(i);
        if (currentFilter !== 'all' && currentFilter !== groupKey) continue;
        
        const [oldZh, newZh, oldEn, newEn] = CONTRASTS[i];
        const item = document.createElement('div');
        item.className = 'item' + (expandedItems.has(i) ? ' expanded' : '');
        item.setAttribute('data-item', i);
        item.onclick = () => toggleItem(i);
        
        item.innerHTML = `
            <div class="item-header">
                <div style="display: flex; align-items: center; flex: 1;">
                    <span class="item-num">${i}</span>
                    <span class="item-old">${oldZh}</span>
                </div>
                <span class="toggle-icon">▼</span>
            </div>
            <div class="item-content">
                <div class="content-pair">
                    <div class="lang-label">中文 Chinese</div>
                    <div class="lang-col">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                            <div style="flex: 1;">
                                <div class="old-text">旧: ${oldZh}</div>
                                <div class="new-text">新: ${newZh}</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="content-pair">
                    <div class="lang-label">English 英文 <button class="tts-btn" onclick="speakText('${oldEn} becomes ${newEn}', event)">🔊</button></div>
                    <div class="lang-col">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                            <div style="flex: 1;">
                                <div class="old-text">Old: ${oldEn}</div>
                                <div class="new-text">New: ${newEn}</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;
        
        container.appendChild(item);
    }
}

function filterGroup(group) {
    currentFilter = group;
    expandedItems.clear();
    renderItems();
    
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    
    document.getElementById('contentArea').scrollIntoView({behavior: 'smooth'});
}

function speakText(text, event) {
    event.stopPropagation();
    const btn = event.target;
    
    if ('speechSynthesis' in window) {
        speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        
        btn.classList.add('playing');
        utterance.onend = () => btn.classList.remove('playing');
        
        speechSynthesis.speak(utterance);
    }
}

// Search functionality
document.getElementById('searchInput').addEventListener('input', (e) => {
    const query = e.target.value.toLowerCase();
    const items = document.querySelectorAll('[data-item]');
    
    items.forEach(item => {
        const text = item.textContent.toLowerCase();
        item.classList.toggle('hidden', !text.includes(query));
    });
});

// Init
renderNav();
renderItems();

// Show scroll hint on load
setTimeout(() => {
    document.getElementById('scrollHint').classList.add('show');
    setTimeout(() => {
        document.getElementById('scrollHint').classList.remove('show');
    }, 3000);
}, 500);
